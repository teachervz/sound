<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوسائط المتعددة | الدرس الأول</title>
<!-- الخطوط: إن لم يتوفر الإنترنت سيُستخدم خط النظام تلقائياً -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   1) الألوان والمتغيرات العامة
   ===================================================================== */
:root{
  --p900:#2e1760; --p800:#40208a; --p700:#5530b0; --p600:#6d3fd6; --p500:#8b5cf6;
  --p300:#c4b1fb; --p200:#ddd1fd; --p100:#efe9ff; --p50:#f8f5ff;
  --mint:#0fa797; --mint-l:#d3f8f2; --amber:#f59e0b; --amber-l:#fff1cc;
  --rose:#ec4867; --rose-l:#ffe4e9; --sky:#0ea5e9; --sky-l:#ddf2fd;
  --ink:#2a1b47; --muted:#6b5b8a; --white:#fff;
  --shadow:0 24px 60px -24px rgba(76,29,149,.38);
  --shadow-s:0 10px 26px -12px rgba(76,29,149,.32);
  --fh:'Cairo','Tajawal','Segoe UI',Tahoma,'Geeza Pro',sans-serif;
  --fb:'Tajawal','Cairo','Segoe UI',Tahoma,'Geeza Pro',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#ece5fb;color:var(--ink);font-family:var(--fb);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
input{font-family:var(--fb)}
.hidden{display:none !important}

/* =====================================================================
   2) مسرح العرض 16:9 (1920×1080) يتم تكبيره/تصغيره ليملأ الشاشة
   ===================================================================== */
#viewport{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(circle at 20% 10%,#f4efff,#e6ddfa 70%)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:
    radial-gradient(circle at 92% 6%, #e7dcff 0, transparent 32%),
    radial-gradient(circle at 4% 96%, #d6f6f0 0, transparent 30%),
    radial-gradient(circle at 50% 120%, #fff1d6 0, transparent 30%),
    linear-gradient(160deg,#fdfbff 0%,#f4efff 100%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(109,63,214,.13) 1.6px,transparent 1.6px);background-size:44px 44px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 35%,transparent 70%,#000 100%);mask-image:linear-gradient(180deg,#000 0%,transparent 35%,transparent 70%,#000 100%)}

/* =====================================================================
   3) الشرائح والانتقالات
   ===================================================================== */
.slide{position:absolute;inset:0;padding:96px 110px 120px;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s linear .7s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s}
.slide.leave{opacity:0;transform:scale(.97)}
.slide.pre-slide-next{transform:translateX(-140px)}
.slide.pre-slide-prev{transform:translateX(140px)}
.slide.pre-zoom{transform:scale(.9)}
.slide.pre-fade{transform:none}
.slide.no-anim{transition:none !important}

/* ظهور العناصر بالتتابع */
.slide .rv{opacity:0;translate:0 26px}
.slide.active .rv{animation:rvIn .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 100ms + 220ms)}
@keyframes rvIn{to{opacity:1;translate:0 0}}

/* رأس الشريحة: المرحلة + الاستراتيجية + العنوان */
.chips{position:absolute;top:34px;right:60px;display:flex;gap:14px}
.chip{font:800 24px var(--fh);padding:8px 22px;border-radius:999px;background:#fff;box-shadow:var(--shadow-s);color:var(--p700)}
.chip-strat{background:var(--p600);color:#fff}
.s-title{font:900 66px/1.25 var(--fh);color:var(--p900);margin-top:6px}
.s-title .hl{color:var(--p600)}
.s-sub{font:700 32px/1.5 var(--fb);color:var(--muted);margin-top:8px}

/* =====================================================================
   4) الأزرار العامة
   ===================================================================== */
.btn{border:none;border-radius:999px;padding:18px 42px;font:800 32px var(--fh);background:var(--p600);color:#fff;
  box-shadow:0 12px 26px -12px rgba(109,63,214,.8);transition:transform .15s ease,box-shadow .2s,background .2s;display:inline-flex;align-items:center;gap:12px;justify-content:center}
.btn:active{transform:scale(.95)}
.btn-sm{padding:12px 30px;font-size:26px}
.btn-lg{padding:24px 60px;font-size:40px}
.btn-amber{background:var(--amber);box-shadow:0 12px 26px -12px rgba(245,158,11,.8)}
.btn-mint{background:var(--mint);box-shadow:0 12px 26px -12px rgba(15,167,151,.8)}
.btn-outline{background:#fff;color:var(--p700);box-shadow:inset 0 0 0 3px var(--p300),var(--shadow-s)}
.btn-ghost{background:var(--p100);color:var(--p700);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
@media (hover:hover){
  .btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 18px 30px -14px rgba(109,63,214,.85)}
}

/* رسائل التغذية الراجعة */
.feedback{font:900 40px var(--fh);min-height:64px;display:flex;align-items:center;justify-content:center;opacity:0}
.feedback.show{animation:fbIn .5s cubic-bezier(.2,1.4,.4,1) forwards}
.feedback.ok{color:var(--mint)} .feedback.no{color:var(--rose)}
@keyframes fbIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.pop{animation:popA .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popA{0%{transform:scale(.85)}100%{transform:scale(1)}}

.q-bubble{font:800 40px/1.5 var(--fh);color:var(--p900);background:#fff;border-radius:28px;padding:22px 36px;box-shadow:var(--shadow);border-right:12px solid var(--amber)}
.reveal-box{font:700 34px/1.65 var(--fb);background:linear-gradient(135deg,var(--p600),var(--p500));color:#fff;border-radius:28px;padding:24px 36px;box-shadow:var(--shadow);animation:fbIn .5s ease}
.reveal-box b{color:#ffe08a}

/* =====================================================================
   5) الشريحة الترحيبية + الختامية + العنوان
   ===================================================================== */
.cover,.closing,.title-slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.float-icons span{position:absolute;font-size:84px;animation:floaty 6s ease-in-out infinite;animation-delay:calc(var(--k) * -1.1s);opacity:.9;filter:drop-shadow(0 12px 16px rgba(76,29,149,.18))}
.float-icons span:nth-child(1){top:2%;right:4%}
.float-icons span:nth-child(2){top:8%;left:6%}
.float-icons span:nth-child(3){bottom:6%;right:8%}
.float-icons span:nth-child(4){bottom:2%;left:4%}
.float-icons span:nth-child(5){top:42%;right:-1%;font-size:64px}
.float-icons span:nth-child(6){top:44%;left:-1%;font-size:64px}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22px) rotate(4deg)}}
.cover-badge{font:800 34px var(--fh);background:#fff;color:var(--p700);padding:12px 36px;border-radius:999px;box-shadow:var(--shadow-s)}
.cover-title{font:900 104px/1.25 var(--fh);margin-top:30px;background:linear-gradient(120deg,var(--p800),var(--p500) 60%,#c26bf0);-webkit-background-clip:text;background-clip:text;color:transparent;max-width:1500px}
.cover-sub{font:800 50px/1.4 var(--fh);color:var(--ink);margin-top:14px}
.cover-welcome{font:800 44px var(--fh);color:var(--mint);margin-top:28px}
.cover-meta{font:700 30px var(--fb);color:var(--muted);margin-top:16px}
.cover .btn{margin-top:40px}

.t-kicker{font:800 38px var(--fh);color:var(--p600);background:var(--p100);padding:12px 40px;border-radius:999px}
.t-icons{font-size:110px;margin:34px 0 10px;display:flex;gap:40px}
.t-icons span{display:inline-block;animation:floaty 5s ease-in-out infinite;animation-delay:calc(var(--k) * -.8s)}
.t-main{font:900 100px/1.3 var(--fh);color:var(--p900);max-width:1600px}
.t-main em{font-style:normal;color:var(--p600)}
.t-line{width:260px;height:12px;border-radius:12px;background:linear-gradient(90deg,var(--amber),var(--p500));margin:30px auto}
.t-sub{font:700 40px var(--fb);color:var(--muted)}

.cl-star{font-size:130px;animation:floaty 4s ease-in-out infinite}
.cl-title{font:900 100px var(--fh);background:linear-gradient(120deg,var(--p800),var(--p500),#e0569b);-webkit-background-clip:text;background-clip:text;color:transparent}
.cl-msg{font:700 40px/1.6 var(--fb);color:var(--ink);max-width:1400px;margin-top:10px}
.cl-row{display:flex;gap:36px;margin-top:40px}
.cl-card{background:#fff;border-radius:30px;padding:26px 40px;box-shadow:var(--shadow);min-width:520px;max-width:700px;display:flex;flex-direction:column;gap:8px;font-size:48px}
.cl-card span{font:800 30px var(--fh);color:var(--muted)}
.cl-card b{font:800 34px/1.5 var(--fh);color:var(--p800)}
.closing .btn{margin-top:40px}

/* =====================================================================
   6) التحضير + الفرق
   ===================================================================== */
.prep-banner{margin-top:18px;background:linear-gradient(120deg,var(--p700),var(--p500));color:#fff;border-radius:30px;padding:18px 36px;display:flex;align-items:center;gap:26px;box-shadow:var(--shadow)}
.prep-banner .pb-ic{font-size:62px}
.prep-banner small{display:block;font:700 28px var(--fb);opacity:.85}
.prep-banner b{font:900 44px/1.35 var(--fh)}
.prep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.info-card{background:#fff;border-radius:26px;padding:14px 24px;display:flex;align-items:center;gap:22px;box-shadow:var(--shadow-s)}
.info-card .ic{font-size:44px;width:72px;height:72px;border-radius:24px;background:var(--p100);display:grid;place-items:center;flex-shrink:0}
.info-card .lbl{font:700 26px var(--fb);color:var(--muted)}
.info-card .val{font:800 34px/1.35 var(--fh);color:var(--ink)}
.prep-row{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}
.prep-box{background:#fff;border-radius:26px;padding:16px 26px;box-shadow:var(--shadow-s)}
.prep-box h4{font:800 28px var(--fh);color:var(--p700);margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{font:800 22px var(--fh);padding:6px 16px;border-radius:999px;background:var(--p50);color:var(--p800);border:2px solid var(--p200)}
.tag.alt{background:var(--mint-l);border-color:#a7eee3;color:#0b6f65}

.teams-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:50px}
.team-card{background:#fff;border-radius:34px;padding:34px 20px;text-align:center;box-shadow:var(--shadow);border-top:14px solid var(--c);position:relative}
.team-card .t-icon{font-size:110px;animation:floaty 5s ease-in-out infinite}
.team-card .t-name{font:900 40px var(--fh);color:var(--ink);margin-top:6px}
.team-card .t-score{font:900 110px/1 var(--fh);color:var(--c);margin:18px 0}
.t-btns{display:flex;gap:16px;justify-content:center}
.mini{width:78px;height:78px;border-radius:50%;border:none;font:900 44px var(--fh);background:var(--p100);color:var(--p700);transition:transform .15s}
.mini.plus{background:var(--c,var(--p600));color:#fff}
.mini:active{transform:scale(.88)}
.note{font:700 34px/1.6 var(--fb);color:var(--muted);text-align:center;margin-top:44px}

/* =====================================================================
   7) البطاقات المقلوبة
   ===================================================================== */
.def-box{margin-top:18px;background:#fff;border-radius:24px;padding:18px 32px;font:700 32px/1.6 var(--fb);box-shadow:var(--shadow-s);border-right:10px solid var(--mint)}
.def-box b{color:var(--p700)}
.flip-grid{display:grid;gap:30px;margin-top:30px}
.flip{perspective:1600px;background:none;border:none;height:390px;font:inherit;text-align:center;transition:transform .2s}
.flip-in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px}
.front{background:#fff;box-shadow:var(--shadow);border:3px solid var(--p100)}
.front .f-ic{font-size:96px}
.front .f-tx{font:800 34px/1.45 var(--fh);color:var(--ink)}
.front .f-hint{font:700 22px var(--fb);color:var(--p500);background:var(--p50);padding:6px 18px;border-radius:999px}
.back{background:linear-gradient(150deg,var(--p700),var(--p500));color:#fff;transform:rotateY(180deg);box-shadow:var(--shadow)}
.back .b-ic{font-size:84px}
.back .b-title{font:900 36px/1.3 var(--fh);color:#ffe08a}
.back .b-tx{font:700 28px/1.55 var(--fb)}
@media (hover:hover){.flip:hover{transform:translateY(-8px)}}
.bridge-wrap{margin-top:30px;display:flex;align-items:center;gap:26px}
.bridge{flex:1;display:flex;align-items:center;gap:24px;animation:fbIn .6s ease}
.bridge > div{flex:1;border-radius:26px;padding:20px 30px;font:800 32px/1.5 var(--fh);box-shadow:var(--shadow-s)}
.b-old{background:var(--amber-l);color:#7a4b00}
.b-new{background:var(--mint-l);color:#08665c}
.bridge .b-arrow{flex:0;font-size:60px;box-shadow:none;padding:0;color:var(--p500)}

/* =====================================================================
   8) التهيئة (ماذا تتوقعين؟)
   ===================================================================== */
.hook{display:flex;flex-direction:column;gap:26px;margin-top:26px}
.hook-stage{background:#fff;border-radius:30px;padding:22px 28px;box-shadow:var(--shadow);position:relative}
.hook-stage canvas{width:100%;height:200px;display:block;border-radius:18px}
.hook-label{font:800 26px var(--fh);color:var(--muted);margin-bottom:10px}
.hook-label b{color:var(--p700)}
.hook-btns{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.reveal-wrap{display:flex;gap:20px;align-items:flex-start}
.reveal-wrap .reveal-box{flex:1}

/* =====================================================================
   9) قائمة الأهداف
   ===================================================================== */
.obj-list{display:flex;flex-direction:column;gap:18px;margin-top:30px}
.obj{display:flex;align-items:center;gap:26px;background:#fff;border:none;border-radius:26px;padding:16px 26px;box-shadow:var(--shadow-s);text-align:right;position:relative;min-height:96px;transition:transform .2s,background .3s}
.obj-n{font-size:46px;width:72px;height:72px;border-radius:22px;background:var(--p100);display:grid;place-items:center;flex-shrink:0;transition:background .3s}
.obj-t{font:800 38px/1.4 var(--fh);color:var(--ink);transition:opacity .5s,filter .5s}
.obj-lock{position:absolute;right:130px;font:800 30px var(--fh);color:var(--p300);transition:opacity .3s}
.obj.locked .obj-t{opacity:0;filter:blur(8px)}
.obj:not(.locked) .obj-lock{opacity:0}
.obj:not(.locked) .obj-n{background:var(--mint-l)}
.obj.locked{background:repeating-linear-gradient(-45deg,#fff 0 22px,#faf7ff 22px 44px)}
.obj-bar,.row-bar{display:flex;gap:18px;justify-content:center;margin-top:26px}
@media (hover:hover){.obj:hover{transform:translateX(-8px)}}

/* =====================================================================
   10) العصف الذهني
   ===================================================================== */
.bs{position:relative;flex:1;margin-top:10px}
.bs-ring{position:absolute;left:50%;top:50%;width:1160px;height:420px;transform:translate(-50%,-50%);border:3px dashed var(--p200);border-radius:50%}
.bs-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:540px;padding:30px;border-radius:40px;text-align:center;
  background:linear-gradient(135deg,var(--p700),var(--p500));color:#fff;font:900 40px/1.4 var(--fh);box-shadow:var(--shadow);z-index:2}
.bs-ic{display:block;font-size:72px;margin-bottom:6px}
.bubble{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--p300);border-radius:999px;padding:14px 30px;
  font:800 32px var(--fh);color:var(--p900);box-shadow:var(--shadow-s);white-space:nowrap;max-width:440px;overflow:hidden;text-overflow:ellipsis;animation:bubIn .55s cubic-bezier(.2,1.5,.4,1)}
.bubble.sugg{border-color:#7ee2d4;background:var(--mint-l);color:#08665c}
@keyframes bubIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.bs-bar{display:flex;gap:16px;justify-content:center;align-items:center}
.bs-bar input{width:620px;font:700 30px var(--fb);padding:16px 28px;border-radius:999px;border:3px solid var(--p200);outline:none;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.bs-bar input:focus{border-color:var(--p500)}

/* =====================================================================
   11) الاختيار من متعدد
   ===================================================================== */
.q-box{margin-top:26px;background:#fff;border-radius:30px;padding:28px 40px;font:900 50px/1.45 var(--fh);color:var(--p900);box-shadow:var(--shadow);display:flex;align-items:center;gap:24px}
.q-box .q-ic{font-size:64px;width:100px;height:100px;border-radius:28px;background:var(--amber-l);display:grid;place-items:center;flex-shrink:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:30px}
.opt{display:flex;align-items:center;gap:24px;background:#fff;border:4px solid var(--p100);border-radius:28px;padding:22px 32px;font:800 42px var(--fh);color:var(--ink);box-shadow:var(--shadow-s);transition:transform .15s,border-color .2s,background .2s,opacity .3s;text-align:right;min-height:130px}
.opt .o-ic{font-size:60px;width:90px;text-align:center}
.opt .o-tx bdi,.ltr{direction:ltr;unicode-bidi:isolate}
.opt:active{transform:scale(.96)}
.opt.correct{background:var(--mint-l);border-color:var(--mint);animation:popA .5s cubic-bezier(.2,1.6,.4,1)}
.opt.correct::after{content:"✅";margin-right:auto;font-size:48px}
.opt.wrong{background:var(--rose-l);border-color:var(--rose);opacity:.75}
.opt.dim{opacity:.4}
@media (hover:hover){.opt:hover:not(.correct):not(.wrong){border-color:var(--p300);transform:translateY(-4px)}}
.fb-area{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.explain{font:700 30px/1.5 var(--fb);color:var(--p800);background:var(--p100);padding:12px 30px;border-radius:20px;animation:fbIn .5s ease}
.corner-btn{position:absolute;left:60px;top:30px}

/* =====================================================================
   12) التوصيل (مطابقة)
   ===================================================================== */
.match{display:grid;grid-template-columns:1fr 90px 1.25fr;gap:20px;margin-top:34px;align-items:center}
.m-col{display:flex;flex-direction:column;gap:18px}
.m-mid{font-size:60px;text-align:center}
.m-item{background:#fff;border:4px solid var(--p100);border-radius:24px;padding:18px 28px;font:800 32px/1.4 var(--fh);color:var(--ink);box-shadow:var(--shadow-s);text-align:right;min-height:104px;transition:transform .15s,border-color .2s,background .2s}
.m-col.a .m-item{font-size:36px}
.m-item.sel{border-color:var(--p600);background:var(--p50);transform:scale(1.03)}
.m-item.matched{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);cursor:default}
.m-item.matched::before{content:"✓ ";color:var(--c);font-weight:900}
.foot-row{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:20px;min-height:70px}
.dyk{margin-top:10px;background:linear-gradient(120deg,#0b8a7d,#14b8a6);color:#fff;border-radius:26px;padding:20px 34px;font:700 32px/1.6 var(--fb);box-shadow:var(--shadow);animation:fbIn .5s ease}
.dyk b{color:#fff3b0}

/* =====================================================================
   13) فكّري – زاوجي – شاركي
   ===================================================================== */
.tps-q{margin-top:26px}
.tps-row{display:grid;grid-template-columns:repeat(3,1fr) 340px;gap:24px;margin-top:30px;align-items:stretch}
.phase{background:#fff;border:4px solid transparent;border-radius:30px;padding:26px 20px;text-align:center;box-shadow:var(--shadow-s);transition:transform .2s,border-color .2s,background .2s}
.phase .ph-ic{font-size:84px}
.phase .ph-n{font:900 44px var(--fh);color:var(--p800)}
.phase .ph-t{font:700 26px/1.5 var(--fb);color:var(--muted);margin-top:6px}
.phase .ph-s{display:inline-block;margin-top:12px;font:800 24px var(--fh);color:var(--p600);background:var(--p100);padding:4px 18px;border-radius:999px}
.phase.on{border-color:var(--p500);background:var(--p50);transform:translateY(-8px)}
.phase.done{opacity:.6}
.timer-card{background:#fff;border-radius:30px;box-shadow:var(--shadow-s);display:grid;place-items:center;padding:16px}

/* المؤقت */
.timer{position:relative;width:250px;height:250px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:10}
.tr-bg{stroke:var(--p100)}
.tr-fg{stroke:var(--p600);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.warn .tr-fg{stroke:var(--amber)}
.timer.done .tr-fg{stroke:var(--rose)}
.t-num{position:absolute;inset:0;display:grid;place-items:center;font:900 62px var(--fh);color:var(--p900);direction:ltr;padding-bottom:40px}
.t-ctrl{position:absolute;bottom:42px;left:0;right:0;display:flex;gap:10px;justify-content:center;direction:ltr}
.tb{width:52px;height:52px;border-radius:50%;border:none;background:var(--p100);color:var(--p700);font:900 22px var(--fh)}
.tb.go{background:var(--p600);color:#fff}
.timer.warn .t-num{color:#b46c00}
.timer.done{animation:shake .5s}
.timer.compact{width:150px;height:150px}
.timer.compact .t-num{font-size:36px;padding-bottom:30px}
.timer.compact .t-ctrl{bottom:22px}
.timer.compact .tb{width:38px;height:38px;font-size:16px}
.timer.nocontrols .t-ctrl{display:none}
.timer.nocontrols .t-num{padding-bottom:0}
.slide-timer{position:absolute;left:54px;top:22px;background:#fff;border-radius:50%;box-shadow:var(--shadow-s);z-index:5}

/* =====================================================================
   14) الترتيب
   ===================================================================== */
.order{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:26px;flex:1;min-height:0}
.col-h{font:800 30px var(--fh);color:var(--p700);margin-bottom:14px}
.pool,.slots{display:flex;flex-direction:column;gap:14px}
.tile{background:#fff;border:3px solid var(--p200);border-radius:22px;padding:14px 26px;font:800 30px/1.4 var(--fh);color:var(--ink);box-shadow:var(--shadow-s);text-align:right;transition:transform .15s,opacity .3s,border-color .2s;min-height:80px}
.tile.used{opacity:0;pointer-events:none;transform:scale(.9)}
@media (hover:hover){.tile:hover{border-color:var(--p500);transform:translateX(-6px)}}
.slot{display:flex;align-items:center;gap:20px;border:3px dashed var(--p200);border-radius:22px;padding:10px 20px;min-height:80px;background:rgba(255,255,255,.5);transition:background .3s,border-color .3s}
.slot .s-n{width:52px;height:52px;border-radius:50%;background:var(--p100);color:var(--p700);display:grid;place-items:center;font:900 28px var(--fh);flex-shrink:0}
.slot .s-tx{font:800 30px/1.4 var(--fh)}
.slot.filled{border-style:solid;border-color:var(--mint);background:var(--mint-l);animation:popA .45s cubic-bezier(.2,1.6,.4,1)}
.slot.filled .s-n{background:var(--mint);color:#fff}
/* شكل الدرج لوحدات القياس */
.order.stairs{grid-template-columns:1fr;gap:26px}
.order.stairs .pool{flex-direction:row;justify-content:center;flex-wrap:wrap;min-height:96px}
.order.stairs .tile{text-align:center;min-width:240px}
.order.stairs .slots{flex-direction:row;align-items:flex-end;justify-content:center;gap:22px}
.order.stairs .slot{flex-direction:column;justify-content:flex-end;width:250px;height:calc(110px + var(--h) * 46px);padding:14px;text-align:center}
.extra{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:18px;animation:fbIn .5s ease}
.extra .x-chip{background:#fff;border-radius:22px;padding:14px 24px;font:800 28px var(--fh);box-shadow:var(--shadow-s);border-bottom:6px solid var(--p300)}
.extra .x-chip small{display:block;font:700 24px var(--fb);color:var(--p600)}
.tip{font:700 28px/1.5 var(--fb);color:var(--p800);background:var(--amber-l);border-radius:20px;padding:12px 26px;text-align:center}

/* =====================================================================
   15) محاكاة نقل الصور من الكاميرا
   ===================================================================== */
.sim-wrap{display:grid;grid-template-columns:520px 1fr;gap:40px;margin-top:24px;flex:1;min-height:0}
.sim-steps{list-style:none;display:flex;flex-direction:column;gap:16px}
.sim-steps li{display:flex;gap:18px;align-items:center;background:#fff;border-radius:22px;padding:16px 22px;font:800 28px/1.45 var(--fh);box-shadow:var(--shadow-s);border:3px solid transparent;transition:all .3s;color:var(--muted)}
.sim-steps .st-n{width:54px;height:54px;border-radius:50%;background:var(--p100);color:var(--p700);display:grid;place-items:center;flex-shrink:0;font:900 28px var(--fh)}
.sim-steps li.now{border-color:var(--p500);color:var(--ink);transform:translateX(-10px)}
.sim-steps li.done{color:#0b6f65;background:var(--mint-l)}
.sim-steps li.done .st-n{background:var(--mint);color:#fff}
.pc{display:flex;flex-direction:column;align-items:center}
.pc-screen{width:100%;height:560px;border-radius:26px;border:16px solid #2c2342;background:linear-gradient(135deg,#5b8def,#9b6cf0);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.pc-base{width:300px;height:26px;background:#2c2342;border-radius:0 0 20px 20px}
.desk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:40px;flex-direction:column}
.desk-cam{font-size:130px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25));animation:floaty 4s ease-in-out infinite}
.win{position:absolute;background:#fff;border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);overflow:hidden;animation:winIn .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes winIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
.win-bar{background:#f1edf8;padding:10px 20px;font:800 24px var(--fh);color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.autoplay{width:600px;bottom:24px;left:24px}
.ap-head{padding:18px 24px 8px;font:900 32px var(--fh)}
.ap-head small{display:block;font:700 22px var(--fb);color:var(--muted)}
.ap-opt{display:block;width:calc(100% - 32px);margin:10px 16px;text-align:right;background:#f7f5fb;border:2px solid #e6e0f3;border-radius:14px;padding:14px 20px;font:800 27px var(--fh);transition:background .2s,border-color .2s}
.ap-opt small{display:block;font:600 21px var(--fb);color:var(--muted);direction:ltr;text-align:right}
.ap-opt:last-child{margin-bottom:18px}
@media (hover:hover){.ap-opt:hover{background:var(--p100);border-color:var(--p300)}}
.explorer{inset:22px}
.ex-tools{display:flex;gap:10px;padding:12px 16px;border-bottom:2px solid #eee;background:#fbfaff}
.ex-tools button{border:2px solid #e3dcf3;background:#fff;border-radius:12px;padding:8px 18px;font:800 24px var(--fh)}
.ex-tools button:disabled{opacity:.4}
.ex-tools button.glow{border-color:var(--mint);background:var(--mint-l);animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(15,167,151,.2)}}
.ex-path{padding:8px 20px;font:700 22px var(--fb);color:var(--muted)}
.ex-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:18px 20px}
.photo{border:3px solid transparent;border-radius:16px;background:none;padding:6px;text-align:center;transition:all .2s}
.photo .ph{display:grid;place-items:center;height:110px;border-radius:12px;font-size:64px;background:linear-gradient(135deg,#ffe9c7,#ffd1e0)}
.photo small{font:700 18px var(--fb);color:var(--muted);direction:ltr;display:block;margin-top:4px}
.photo.sel{border-color:var(--p500);background:var(--p50)}
.photo.fly{animation:flyIn .6s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--k) * 90ms)}
@keyframes flyIn{from{opacity:0;transform:translateY(-60px) scale(.5)}to{opacity:1;transform:none}}
.ex-empty{padding:60px;text-align:center;font:700 28px var(--fb);color:#aaa}
.sim-ok{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--mint);color:#fff;font:800 28px var(--fh);padding:12px 30px;border-radius:999px;white-space:nowrap;animation:fbIn .5s ease}

/* =====================================================================
   16) لاحظي واكتشفي (امتدادات الملفات)
   ===================================================================== */
.files{display:grid;grid-template-columns:repeat(5,1fr);gap:26px;margin-top:34px}
.file{background:#fff;border-radius:28px;padding:26px 14px;text-align:center;box-shadow:var(--shadow-s)}
.file-ic{font-size:90px}
.file-name{font:800 34px var(--fh);margin-top:10px;direction:ltr;unicode-bidi:isolate;display:flex;justify-content:center;gap:2px}
.file-name .fx{transition:all .4s;border-radius:10px;padding:0 4px}
.file-type{font:800 26px var(--fh);color:var(--mint);margin-top:10px;opacity:0;transition:opacity .4s}
.revealed .file-name .fn{color:var(--p600)}
.revealed .file-name .fx{background:var(--amber-l);color:#9a5b00;box-shadow:inset 0 0 0 2px var(--amber)}
.revealed .file-type{opacity:1}
.discover{margin-top:24px;display:flex;gap:24px;align-items:stretch;animation:fbIn .5s ease}
.discover > div{flex:1}
.lg-n{color:var(--p600)} .lg-x{background:var(--amber-l);color:#9a5b00;padding:0 10px;border-radius:10px}

/* =====================================================================
   17) تحدي الدقيقة (تصنيف الامتدادات)
   ===================================================================== */
.sort{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:0}
.sort-top{display:flex;align-items:center;gap:60px}
.sort-score{display:flex;gap:30px;font:900 44px var(--fh)}
.sort-score .ok{color:var(--mint)} .sort-score .no{color:var(--rose)}
.sort-card{width:760px;height:210px;border-radius:40px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;transition:background .25s;border:5px solid var(--p100)}
.sort-card.good{background:var(--mint-l);border-color:var(--mint)}
.sort-card.bad{background:var(--rose-l);border-color:var(--rose)}
.sc-ext{font:900 120px var(--fh);color:var(--p800);direction:ltr}
.sc-hint{font:800 36px/1.5 var(--fh);color:var(--muted);text-align:center;padding:0 40px}
.sc-file{font-size:70px;margin-left:20px}
.sc-row{display:flex;align-items:center}
.sc-correct{display:block;font:800 30px var(--fh);color:var(--rose);text-align:center}
.sc-result{text-align:center;font:900 46px var(--fh);color:var(--p800)}
.sc-result b{display:block;font-size:110px;color:var(--mint);line-height:1.1}
.sort-cats{display:flex;gap:20px}
.cat{width:250px;border:none;border-radius:28px;background:#fff;box-shadow:var(--shadow-s);padding:12px 10px;font:900 32px var(--fh);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:8px solid var(--c);transition:transform .12s}
.cat span{font-size:54px}
.cat:active:not(:disabled){transform:scale(.93)}
.cat:disabled{opacity:.45}
@media (hover:hover){.cat:hover:not(:disabled){transform:translateY(-6px)}}

/* =====================================================================
   18) أدوات أوداسيتي
   ===================================================================== */
.tools-wrap{display:grid;grid-template-columns:640px 1fr;gap:36px;margin-top:28px}
.aud-card{background:linear-gradient(160deg,#fff,var(--p50));border-radius:32px;padding:30px 34px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.aud-logo{font-size:90px;line-height:1}
.aud-card h3{font:900 44px var(--fh);color:var(--p800)}
.aud-card p{font:700 30px/1.6 var(--fb)}
.aud-card .btn{align-self:flex-start}
.inst{display:flex;flex-wrap:wrap;gap:10px;align-items:center;animation:fbIn .5s ease}
.inst-step{background:var(--p600);color:#fff;font:800 24px var(--fh);padding:8px 18px;border-radius:14px;direction:ltr}
.inst-arr{color:var(--p500);font-size:28px;font-weight:900}
.tools-game h3{font:900 40px var(--fh);color:var(--p800);margin-bottom:18px}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tool{background:#fff;border:3px solid var(--p100);border-radius:26px;height:200px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;transition:transform .15s,border-color .2s}
.tool-ic{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;background:var(--p100);color:var(--p700)}
.tool-ic svg{width:46px;height:46px}
.tool[data-k="record"] .tool-ic{color:var(--rose)}
.tool[data-k="play"] .tool-ic{color:var(--mint)}
.tool-name{text-align:center;opacity:0;transition:opacity .3s}
.tool-name b{display:block;font:900 30px var(--fh)}
.tool-name small{font:700 21px var(--fb);color:var(--muted);direction:ltr;display:block}
.tool-q{position:absolute;bottom:22px;font:900 40px var(--fh);color:var(--p300)}
.tool.open .tool-name{opacity:1} .tool.open .tool-q{display:none}
.tool.open{border-color:var(--mint)}
@media (hover:hover){.tool:hover{transform:translateY(-5px)}}
.tools-game .tip{margin-top:20px}

/* =====================================================================
   19) محاكي أوداسيتي
   ===================================================================== */
.aud-wrap{display:grid;grid-template-columns:400px 1fr;gap:28px;margin-top:20px;flex:1;min-height:0}
.tasks{background:#fff;border-radius:28px;padding:22px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.tasks h3{font:900 34px var(--fh);color:var(--p800);margin-bottom:10px}
.tasks ul{list-style:none;display:flex;flex-direction:column;gap:8px;flex:1}
.tasks li{display:flex;gap:14px;align-items:center;font:800 23px/1.4 var(--fh);color:var(--muted);padding:8px 10px;border-radius:14px;transition:all .3s}
.tasks .chk{width:36px;height:36px;border-radius:12px;border:3px solid var(--p200);flex-shrink:0;display:grid;place-items:center;font-size:22px;color:#fff;transition:all .3s}
.tasks li.done{color:#0b6f65;background:var(--mint-l)}
.tasks li.done .chk{background:var(--mint);border-color:var(--mint)}
.tasks li.done .chk::after{content:"✓";font-weight:900}
.tasks-prog{height:14px;border-radius:14px;background:var(--p100);overflow:hidden;margin-top:10px}
.tasks-prog span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),#5eead4);transition:width .5s}
.app{background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;border:2px solid #e8e2f5}
.app-bar{background:#2c2342;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;font:800 22px var(--fh)}
.app-bar .dots i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ff5f57;margin-right:6px}
.app-bar .dots i:nth-child(2){background:#febc2e} .app-bar .dots i:nth-child(3){background:#28c840}
.app-tools{display:flex;flex-wrap:wrap;gap:12px;padding:12px 14px;background:#f6f3fc;border-bottom:2px solid #e8e2f5;align-items:center}
.tg{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:6px 8px;border:2px solid #ece6f7}
.tg-label{font:800 18px var(--fh);color:var(--muted);padding:0 6px}
.tbtn{width:56px;height:56px;border-radius:14px;border:none;background:var(--p100);color:var(--p700);display:grid;place-items:center;transition:transform .12s,background .2s}
.tbtn svg{width:30px;height:30px}
.tbtn[data-a="play"]{color:var(--mint)} .tbtn[data-a="record"]{color:var(--rose)}
.tbtn:active,.mbtn:active{transform:scale(.92)}
.tbtn.on{background:var(--mint);color:#fff}
.tbtn.rec{background:var(--rose);color:#fff;animation:glow 1s infinite}
.mbtn{border:none;border-radius:12px;background:var(--p100);color:var(--p800);font:800 20px var(--fh);padding:12px 14px;transition:transform .12s,background .2s;white-space:nowrap}
.mbtn.danger{background:var(--rose-l);color:#b0213e}
@media (hover:hover){.tbtn:hover,.mbtn:hover{background:var(--p200)} .mbtn.danger:hover{background:#ffcdd6}}
.tracks{display:flex;flex-direction:column;gap:10px;padding:12px 14px;flex:1}
.track{display:flex;gap:12px;align-items:stretch}
.tr-head{width:150px;flex-shrink:0;background:#f6f3fc;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;font:800 20px var(--fh)}
.tr-head small{font:700 17px var(--fb);color:var(--muted)}
.tr-head input[type=range]{width:100%;accent-color:var(--p600)}
.track canvas{flex:1;min-width:0;height:200px;border-radius:14px;cursor:crosshair;touch-action:none;display:block}
.track.t2 canvas{height:130px}
.app-status{display:flex;justify-content:space-between;padding:10px 18px;background:#f6f3fc;border-top:2px solid #e8e2f5;font:800 22px var(--fh);color:var(--p800);direction:rtl}
.modal{position:absolute;inset:0;background:rgba(44,35,66,.45);display:grid;place-items:center;z-index:10}
.modal-card{background:#fff;border-radius:24px;padding:28px 34px;width:640px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);direction:rtl;animation:winIn .35s ease}
.modal-card h4{font:900 32px var(--fh);color:var(--p800);margin-bottom:14px}
.modal-card input[type=range]{width:100%;accent-color:var(--p600);height:30px}
.speed-val{font:900 50px var(--fh);color:var(--p600);text-align:center;direction:ltr}
.modal-btns{display:flex;gap:12px;justify-content:center;margin-top:18px}
.rec-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.85);font:900 46px var(--fh);color:var(--rose);z-index:11;direction:rtl}

/* =====================================================================
   20) صح أم خطأ
   ===================================================================== */
.tf-list{display:flex;flex-direction:column;gap:16px;margin-top:26px}
.tf-row{display:flex;align-items:center;gap:22px;background:#fff;border-radius:24px;padding:14px 22px;box-shadow:var(--shadow-s);border:3px solid transparent;transition:background .3s,border-color .3s}
.tf-num{width:58px;height:58px;border-radius:18px;background:var(--p100);color:var(--p700);font:900 30px var(--fh);display:grid;place-items:center;flex-shrink:0}
.tf-text{flex:1;font:800 32px/1.45 var(--fh)}
.tf-fix{font:700 24px/1.4 var(--fb);margin-top:2px;min-height:0}
.tf-fix.ok{color:#0b6f65} .tf-fix.no{color:var(--rose)}
.tf-btns{display:flex;gap:12px}
.tf-b{border:none;border-radius:18px;padding:12px 26px;font:900 28px var(--fh);transition:transform .12s}
.tf-b.t{background:var(--mint-l);color:#0b6f65} .tf-b.f{background:var(--rose-l);color:#b0213e}
.tf-b:active{transform:scale(.92)}
.tf-row.ok{background:#f1fdfb;border-color:var(--mint)}
.tf-row.ok .tf-btns{opacity:.35;pointer-events:none}
.tf-row.ok .tf-num{background:var(--mint);color:#fff}

/* =====================================================================
   21) صناديق المراجعة + الخلاصة + التقييم الفوري
   ===================================================================== */
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:40px;flex:1;max-height:600px}
.box{border:none;border-radius:34px;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 65%,#fff));color:#fff;font:900 130px var(--fh);box-shadow:var(--shadow);transition:transform .2s,opacity .3s;position:relative;overflow:hidden}
.box::after{content:"🎁";position:absolute;top:18px;left:24px;font-size:46px;opacity:.85}
.box.used{opacity:.35}
.box.used::after{content:"✅"}
@media (hover:hover){.box:hover{transform:translateY(-8px) rotate(-1deg)}}
.box-modal{position:absolute;inset:0;background:rgba(46,23,96,.45);display:grid;place-items:center;z-index:20;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.bm-card{width:1200px;background:#fff;border-radius:40px;padding:44px 56px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);text-align:center;animation:winIn .4s cubic-bezier(.2,1.3,.4,1)}
.bm-num{display:inline-block;font:900 34px var(--fh);color:#fff;background:var(--p600);padding:6px 30px;border-radius:999px}
.bm-q{font:900 54px/1.5 var(--fh);color:var(--p900);margin:24px 0}
.bm-a{font:800 40px/1.5 var(--fh);color:#0b6f65;background:var(--mint-l);border-radius:24px;padding:18px 30px;margin-bottom:24px;animation:fbIn .4s ease}
.bm-btns{display:flex;gap:20px;justify-content:center}

.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:36px}
.sum{background:#fff;border-radius:30px;padding:26px 30px;box-shadow:var(--shadow-s);border-top:10px solid var(--c);min-height:250px}
.sum .s-ic{font-size:60px}
.sum h4{font:900 36px var(--fh);color:var(--p800);margin:6px 0}
.sum p{font:700 27px/1.55 var(--fb);color:var(--ink)}

.exit{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;margin-top:34px}
.vote{display:flex;flex-direction:column;gap:22px}
.vote-b{display:grid;grid-template-columns:100px 1fr 90px;align-items:center;gap:20px;background:#fff;border:4px solid var(--p100);border-radius:30px;padding:20px 28px;box-shadow:var(--shadow-s);text-align:right;transition:transform .12s,border-color .2s}
.vote-b:active{transform:scale(.97)}
.v-ic{font-size:76px}
.v-l{font:900 36px var(--fh)}

#hint kbd{font-family:var(--fh);font-weight:800;background:var(--p100);border-radius:6px;padding:0 .4em}
body.idle #controls{opacity:0;transform:translate(-50%,30px);pointer-events:none}

body.idle{cursor:none}

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const shake = el => retrigger(el, 'shake');
const popEl = el => retrigger(el, 'pop');
function showFb(fb, text, type) { fb.textContent = text; fb.className = 'feedback ' + type; void fb.offsetWidth; fb.classList.add('show'); }
function clearFb(fb) { fb.textContent = ''; fb.className = 'feedback'; }

let toastTimer;
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* تعبئة القيم التلقائية مثل التاريخ واسم المادة */
function todayStrings() {
  const d = new Date();
  const f = (loc, o) => { try { return new Intl.DateTimeFormat(loc, o).format(d); } catch (e) { return ''; } };
  return {
    day: f('ar-SA', { weekday: 'long' }),
    hijri: f('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }),
    greg: f('ar-u-ca-gregory-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' })
  };
}
function fill(str) {
  const v = Object.assign({}, LESSON.info, todayStrings());
  return String(str).replace(/\{\{(\w+)\}\}/g, (_, k) => v[k] ?? '');
}

/* #####################################################################
   🔊 المؤثرات الصوتية — كلها مولّدة بـ Web Audio API بدون ملفات خارجية
   ##################################################################### */
const Sound = (() => {
  let ctx, master, noiseBuf;
  function ac() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      master = ctx.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const out = () => { ac(); return master; };
  function noise() {
    const c = ac();
    if (!noiseBuf) {
      noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }
  /* صفقة واحدة: دفعة ضوضاء قصيرة مفلترة */
  function oneClap(t, vol, freq) {
    const c = ac();
    const src = c.createBufferSource(); src.buffer = noise();
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.1;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    const g = c.createGain();
    const len = 0.06 + Math.random() * 0.05;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0008, t + len);
    src.connect(hp).connect(bp).connect(g).connect(master);
    src.start(t, Math.random() * 0.8, len + 0.02);
  }
  /* تصفيق جماعي قصير (~2 ثانية) */
  function applause() {
    const c = ac(); const now = c.currentTime + 0.02; const dur = 1.9;
    for (let p = 0; p < 11; p++) {
      let t = now + Math.random() * 0.12;
      const rate = 0.12 + Math.random() * 0.07;
      const f = 1000 + Math.random() * 1600;
      while (t < now + dur) {
        const fade = Math.max(0.05, 1 - Math.pow((t - now) / dur, 2));
        oneClap(t, (0.22 + Math.random() * 0.22) * fade, f * (0.9 + Math.random() * 0.2));
        t += rate * (0.85 + Math.random() * 0.3);
      }
    }
  }
  function tone(freq, start, dur, type = 'sine', vol = 0.2) {
    const c = ac(); const t = c.currentTime + start;
    const o = c.createOscillator(); const g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    ac, out, applause,
    success() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, i === 3 ? 0.6 : 0.25, 'triangle', 0.22)); },
    wrong()   { tone(330, 0, 0.2, 'sine', 0.18); tone(247, 0.16, 0.35, 'sine', 0.18); },
    pop()     { tone(880, 0, 0.12, 'triangle', 0.15); tone(1320, 0.05, 0.12, 'triangle', 0.1); },
    tick()    { tone(1400, 0, 0.05, 'square', 0.05); },
    bell()    { tone(880, 0, 1.4, 'sine', 0.25); tone(1320, 0, 1, 'sine', 0.1); tone(880, 0.35, 1.2, 'sine', 0.18); },
    flip()    { tone(620, 0, 0.08, 'triangle', 0.08); }
  };
})();

/* #####################################################################
   🎵 مختبر الصوت: توليد لحن وإيقاع + التشغيل + التسجيل من الميكروفون
   ##################################################################### */
const AudioLab = (() => {
  let melodyBuf, anthemBuf = null;
  /* تحميل النشيد الوطني من anthem.js وتحويله إلى صوت أحادي */
  const anthemReady = (async () => {
    if (!window.ANTHEM_B64) return null;
    try {
      const bin = atob(window.ANTHEM_B64), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const c = Sound.ac(), dec = await c.decodeAudioData(u8.buffer);
      const mono = c.createBuffer(1, dec.length, dec.sampleRate), m = mono.getChannelData(0);
      for (let ch = 0; ch < dec.numberOfChannels; ch++) { const d = dec.getChannelData(ch); for (let i = 0; i < d.length; i++) m[i] += d[i] / dec.numberOfChannels; }

  })();
  /* المقطع الافتراضي: النشيد الوطني إن توفر، وإلا لحن مولّد */
  function source() { return anthemBuf || melody(); }
  const sourceName = () => (anthemBuf ? (window.ANTHEM_NAME || 'النشيد الوطني') + ' 🇸🇦' : 'لحن قصير');
  /* لحن «نجمة صغيرة» بصوت يشبه صندوق الموسيقى */
  function melody() {
    if (melodyBuf) return melodyBuf;
    const c = Sound.ac(), sr = c.sampleRate, beat = 0.4;
    const N = { C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440 };
    const seq = [['C4',1],['C4',1],['G4',1],['G4',1],['A4',1],['A4',1],['G4',2],['F4',1],['F4',1],['E4',1],['E4',1],['D4',1],['D4',1],['C4',2]];

        if (tt > dur) env *= Math.max(0, 1 - (tt - dur) / 0.25);
        const w = 2 * Math.PI * f * tt;
        d[s0 + i] += (Math.sin(w) + 0.45 * Math.sin(2 * w) + 0.18 * Math.sin(3 * w) + 0.08 * Math.sin(5 * w)) * env * 0.36;
      }

  }
  /* إيقاع طبول بسيط لاستخدامه في «الدمج» */
  function beat(len) {
    const sr = Sound.ac().sampleRate, d = new Float32Array(len), step = 0.2;
    let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647 * 2 - 1; };

    rec.stop(); await stopped; stream.getTracks().forEach(t => t.stop());

    return buf;

/* رسم الشكل الموجي على Canvas */
function drawWave(cv, data, o = {}) {
  const g = cv.getContext('2d'), W = cv.width, H = cv.height, total = o.total || data.length || 1;
  g.fillStyle = o.bg || '#faf8ff'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(109,63,214,.18)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
  if (o.sel) { const x1 = o.sel.a / total * W, x2 = o.sel.b / total * W; g.fillStyle = 'rgba(139,92,246,.22)'; g.fillRect(x1, 0, x2 - x1, H); g.fillStyle = 'rgba(109,63,214,.7)'; g.fillRect(x1, 0, 2, H); g.fillRect(x2 - 2, 0, 2, H); }
  const per = total / W, cols = Math.min(W, Math.ceil(data.length / per));
  const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, o.color2 || '#8b5cf6'); grad.addColorStop(.5, o.color || '#5530b0'); grad.addColorStop(1, o.color2 || '#8b5cf6');
  g.fillStyle = grad;
  for (let x = 0; x < cols; x++) {
    const s = Math.floor(x * per), e = Math.min(data.length, Math.floor((x + 1) * per));
    const stride = Math.max(1, Math.floor((e - s) / 100));
    let mn = 0, mx = 0;
    for (let i = s; i < e; i += stride) { const v = data[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    const y1 = H / 2 - mx * H * 0.46, y2 = H / 2 - mn * H * 0.46;
    g.fillRect(x, y1, 1, Math.max(1.5, y2 - y1));
  }
  if (o.playhead != null) { const x = o.playhead / total * W; g.fillStyle = '#ec4867'; g.fillRect(x - 1.5, 0, 3, H); }
}

const Confetti = (() => {
  const cv = $('#confetti'), g = cv.getContext('2d'); let parts = [], raf = null;
  const colors = ['#8b5cf6', '#6d3fd6', '#f59e0b', '#0fa797', '#ec4867', '#0ea5e9', '#fde047'];
  function fire(n = 150) {
    cv.width = innerWidth; cv.height = innerHeight;
    for (let i = 0; i < n; i++) parts.push({
      x: innerWidth * (0.2 + Math.random() * 0.6), y: innerHeight * 0.45,
      vx: (Math.random() - 0.5) * 22, vy: -Math.random() * 20 - 6,
      w: 8 + Math.random() * 8, h: 10 + Math.random() * 12, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      c: colors[i % colors.length], life: 0
    });
    if (!raf) loop();
  }
  function loop() {
    g.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => { p.vy += 0.55; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - p.life / 140); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); });
    parts = parts.filter(p => p.y < cv.height + 40 && p.life < 140);
    if (parts.length) raf = requestAnimationFrame(loop); else { raf = null; g.clearRect(0, 0, cv.width, cv.height); }
  }
  return { fire };
})();
const confetti = n => Confetti.fire(n);

/* #####################################################################
   ⏱️ المؤقت (يُستخدم في التحديات)
   ##################################################################### */
function makeTimer(seconds, opt = {}) {
  const el = document.createElement('div');
  el.className = 'timer' + (opt.compact ? ' compact' : '') + (opt.noControls ? ' nocontrols' : '');
  el.innerHTML = `<svg viewBox="0 0 120 120"><circle class="tr-bg" cx="60" cy="60" r="52"/><circle class="tr-fg" cx="60" cy="60" r="52"/></svg>
    <div class="t-num"></div><div class="t-ctrl"><button class="tb go" data-t="toggle" title="تشغيل/إيقاف">▶</button><button class="tb" data-t="reset" title="إعادة">🔄</button></div>`;
  let total = seconds, left = seconds, iv = null;
  const fg = $('.tr-fg', el), num = $('.t-num', el), tog = $('[data-t=toggle]', el), C = 2 * Math.PI * 52;
  fg.style.strokeDasharray = C;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  function render() { num.textContent = fmt(left); fg.style.strokeDashoffset = C * (1 - left / total); el.classList.toggle('warn', left <= 10 && left > 0); el.classList.toggle('done', left === 0); }
  function start() {
    if (iv) return; if (left === 0) left = total;
    tog.textContent = '❚❚';
    iv = setInterval(() => {
      left--;
      if (left <= 5 && left > 0) Sound.tick();
      if (left <= 0) { left = 0; stop(); Sound.bell(); opt.onEnd && opt.onEnd(); }
      render();
    }, 1000);
  }
  function stop() { clearInterval(iv); iv = null; tog.textContent = '▶'; }
  function reset(s) { stop(); if (s) total = s; left = total; render(); }
  tog.onclick = () => (iv ? stop() : start());
  $('[data-t=reset]', el).onclick = () => reset();
  render();
  return { el, start, stop, reset, get running() { return !!iv; } };
}

  /* ---------- التوصيل بين عمودين ---------- */
  match(s, el) {
    const colors = ['#8b5cf6', '#0fa797', '#f59e0b', '#ec4867', '#0ea5e9'];
    const order = shuffle(s.pairs.map((_, i) => i));
    el.innerHTML = head(s) + `<div class="match">
        <div class="m-col a rv">${s.pairs.map((p, i) => `<button class="m-item" data-i="${i}">${p.a}</button>`).join('')}</div>
        <div class="m-mid rv">🔗</div>
        <div class="m-col b rv">${order.map(i => `<button class="m-item" data-i="${i}">${s.pairs[i].b}</button>`).join('')}</div>
      </div>
      <div class="foot-row rv"><div class="feedback"></div>${s.didYouKnow ? `<button class="btn btn-mint btn-sm" data-dyk>💡 هل تعلمين؟</button>` : ''}</div>
      ${s.didYouKnow ? `<div class="dyk hidden">${s.didYouKnow}</div>` : ''}`;
    const fb = $('.feedback', el); let selA = null, selB = null, done = 0;
    const check = () => {
      if (!selA || !selB) return;
      if (selA.dataset.i === selB.dataset.i) {
        const c = colors[done % colors.length];
        [selA, selB].forEach(x => { x.classList.remove('sel'); x.classList.add('matched'); x.style.setProperty('--c', c); x.disabled = true; });
        done++; Sound.pop();
        if (done === s.pairs.length) { showFb(fb, 'أحسنتِ! 👏 وصّلتِ جميع المنافذ', 'ok'); Sound.success(); confetti(); }
        else showFb(fb, 'إجابة صحيحة ✅', 'ok');
      } else {
        [selA, selB].forEach(x => { x.classList.remove('sel'); shake(x); });
        showFb(fb, 'حاولي مرة أخرى 💜', 'no'); Sound.wrong();
      }
      selA = selB = null;
    };
    $$('.m-col.a .m-item', el).forEach(b => (b.onclick = () => { if (selA) selA.classList.remove('sel'); selA = b; b.classList.add('sel'); check(); }));
    $$('.m-col.b .m-item', el).forEach(b => (b.onclick = () => { if (selB) selB.classList.remove('sel'); selB = b; b.classList.add('sel'); check(); }));
    const d = $('[data-dyk]', el); if (d) d.onclick = () => { $('.dyk', el).classList.toggle('hidden'); Sound.pop(); };
  },

  /* ---------- محاكاة نقل الصور من الكاميرا ---------- */
  camsim(s, el) {
    el.innerHTML = head(s) + `<div class="sim-wrap">
        <div class="rv"><ol class="sim-steps">${s.steps.map((t, i) => `<li><span class="st-n">${i + 1}</span><span>${t}</span></li>`).join('')}</ol>

        <div class="pc rv"><div class="pc-screen"></div><div class="pc-base"></div></div>
      </div>`;
    const scr = $('.pc-screen', el); let state = 0; const sel = new Set();
    const photos = (cls = '') => s.photos.map(([e, n], i) => `<button class="photo ${cls}" data-p="${i}" style="--k:${i}"><span class="ph">${e}</span><small>${n}</small></button>`).join('');
    function setStep(n) {
      state = n;
      $$('.sim-steps li', el).forEach((li, i) => { li.classList.toggle('done', i < n); li.classList.toggle('now', i === n); });

      if (state === 0) scr.innerHTML = `<div class="desk"><div class="desk-cam">📷</div><button class="btn btn-lg" data-c="connect">🔌 وصّلي الكاميرا بمنفذ USB</button></div>`;

      if (state === 2) scr.innerHTML = `<div class="win explorer"><div class="win-bar"><span>📷 الكاميرا الرقمية</span><span>✕</span></div>
          <div class="ex-tools"><button data-c="cut">✂️ قص</button><button data-c="copy">📄 نسخ</button><button disabled>📋 لصق</button><button data-c="all">☑️ تحديد الكل</button></div>
          <div class="ex-path">هذا الكمبيوتر › الكاميرا › DCIM — اضغطي على الصور لتحديدها</div>

      if (state === 3 || state === 4) scr.innerHTML = `<div class="win explorer"><div class="win-bar"><span>🖼️ الصور (Pictures)</span><span>✕</span></div>
          <div class="ex-tools"><button disabled>✂️ قص</button><button disabled>📄 نسخ</button><button data-c="paste" class="${state === 3 ? 'glow' : ''}" ${state === 4 ? 'disabled' : ''}>📋 لصق</button></div>
          <div class="ex-path">هذا الكمبيوتر › الصور</div>
          ${state === 3 ? '<div class="ex-empty">📂 هذا المجلد فارغ… اضغطي «لصق»</div>' : `<div class="ex-grid">${photos('fly')}</div>`}</div>
          ${state === 4 ? '<div class="sim-ok">✅ تم نقل الصور بنجاح — لاحظي: لم نحتج لأي برنامج خاص!</div>' : ''}`;
    }
    scr.addEventListener('click', e => {
      const t = e.target.closest('[data-c],[data-p]'); if (!t) return;
      const c = t.dataset.c;
      if (t.dataset.p != null && state === 2) { const i = t.dataset.p; sel.has(i) ? sel.delete(i) : sel.add(i); t.classList.toggle('sel'); return; }
      if (c === 'connect') { t.disabled = true; t.textContent = '⏳ جارٍ التعرّف على الكاميرا…'; setTimeout(() => { Sound.pop(); setStep(1); }, 1000); }
      if (c === 'open') { Sound.pop(); setStep(2); }
      if (c === 'other' || c === 'none') { shake(t); Sound.wrong(); toast('في درسنا نختار: «فتح المجلد لعرض الملفات» 😉'); }
      if (c === 'all') { sel.clear(); $$('.photo', scr).forEach(p => { sel.add(p.dataset.p); p.classList.add('sel'); }); Sound.pop(); }
      if (c === 'copy' || c === 'cut') {
        if (!sel.size) { toast('حدّدي الصور أولاً 👆'); shake(t); return; }
        Sound.pop(); toast(c === 'copy' ? 'تم النسخ 📄 الآن افتحي مجلد الصور' : 'تم القص ✂️ الآن افتحي مجلد الصور'); setTimeout(() => setStep(3), 700);
      }
      if (c === 'paste' && state === 3) { setStep(4); Sound.success(); confetti(); }
    });
    $('[data-reset]', el).onclick = () => { sel.clear(); setStep(0); };
    setStep(0);
  },

        <div class="rv">${!stairs && s.poolTitle ? `<div class="col-h">${s.poolTitle}</div>` : ''}<div class="pool"></div></div>
        <div class="rv">${!stairs && s.slotsTitle ? `<div class="col-h">${s.slotsTitle}</div>` : ''}<div class="slots">${s.items.map((_, i) => `<div class="slot" style="--h:${i}"><span class="s-n">${i + 1}</span><span class="s-tx"></span></div>`).join('')}</div></div>
      </div>

      ${s.extra ? `<div class="extra hidden">${s.extra.map(x => `<div class="x-chip">${x.text}<small>${x.small}</small></div>`).join('')}${s.tip ? `<div class="tip">${s.tip}</div>` : ''}</div>` : ''}`;
    if (s.timer) addSlideTimer(el, s.timer);
    const pool = $('.pool', el), slots = $$('.slot', el), fb = $('.feedback', el), extra = $('.extra', el);
    let step = 0;
    function setup() {
      step = 0; clearFb(fb); extra && extra.classList.add('hidden');
      slots.forEach(sl => { sl.classList.remove('filled'); $('.s-tx', sl).innerHTML = ''; });
      let order = shuffle(s.items.map((_, i) => i)); if (order.every((v, i) => v === i)) order.reverse();
      pool.innerHTML = order.map(i => `<button class="tile" data-i="${i}">${s.items[i]}</button>`).join('');
      $$('.tile', pool).forEach(t => (t.onclick = () => {
        if (+t.dataset.i === step) {
          t.classList.add('used'); slots[step].classList.add('filled'); $('.s-tx', slots[step]).innerHTML = s.items[step]; step++; Sound.pop();
          if (step === s.items.length) { showFb(fb, s.done || 'أحسنتِ! 👏 ترتيب صحيح', 'ok'); Sound.success(); confetti(); extra && extra.classList.remove('hidden'); if (stairs) pool.style.display = 'none'; }
        } else { shake(t); Sound.wrong(); showFb(fb, 'حاولي مرة أخرى 💜', 'no'); }

  /* ---------- تحدي الدقيقة (تصنيف) ---------- */
  sort(s, el) {
    const cats = Object.fromEntries(s.categories.map(c => [c.key, c]));
    el.innerHTML = head(s) + `<div class="sort">
        <div class="sort-top rv"><div class="sort-score"><span class="ok">✅ <b class="n-ok">0</b></span><span class="no">❌ <b class="n-no">0</b></span></div><div class="sort-timer"></div></div>
        <div class="sort-card rv"><span class="sc-hint">${s.intro}</span></div>
        <div class="sort-cats rv">${s.categories.map(c => `<button class="cat" data-k="${c.key}" style="--c:${c.color}" disabled><span>${c.icon}</span>${c.label}</button>`).join('')}</div>
        <div class="rv"><button class="btn" data-start>🚀 ابدئي التحدي</button></div>
      </div>`;
    const timer = makeTimer(s.seconds, { compact: true, noControls: true, onEnd: finish });
    $('.sort-timer', el).appendChild(timer.el); el._timers = [timer];
    const card = $('.sort-card', el), startBtn = $('[data-start]', el), catBtns = $$('.cat', el);
    let queue = [], cur = null, ok = 0, no = 0, running = false, busy = false;
    const upd = () => { $('.n-ok', el).textContent = ok; $('.n-no', el).textContent = no; };
    function next() {
      if (!running) return;
      if (!queue.length) queue = shuffle(s.items);
      cur = queue.pop(); busy = false; card.className = 'sort-card';
      card.innerHTML = `<div class="sc-row"><span class="sc-file">📁</span><span class="sc-ext">${cur[0]}</span></div>`; popEl(card);
    }
    function start() { queue = shuffle(s.items); ok = no = 0; upd(); running = true; catBtns.forEach(b => (b.disabled = false)); startBtn.parentElement.style.visibility = 'hidden'; timer.reset(); timer.start(); next(); }
    function finish() {
      running = false; catBtns.forEach(b => (b.disabled = true)); card.className = 'sort-card';
      card.innerHTML = `<div class="sc-result">🎉 انتهى الوقت!<b>${ok}</b>إجابة صحيحة</div>`;
      startBtn.textContent = '🔁 تحدٍّ جديد'; startBtn.parentElement.style.visibility = '';
      if (ok > 0) { Sound.success(); confetti(); }
    }
    catBtns.forEach(b => (b.onclick = () => {
      if (!running || busy) return; busy = true;
      if (b.dataset.k === cur[1]) { ok++; card.classList.add('good'); Sound.pop(); upd(); setTimeout(next, 320); }
      else { no++; card.classList.add('bad'); Sound.wrong(); upd(); card.insertAdjacentHTML('beforeend', `<span class="sc-correct">الصحيح: ${cats[cur[1]].icon} ${cats[cur[1]].label}</span>`); setTimeout(next, 1100); }
    }));
    startBtn.onclick = start;
    el._leave = () => { if (running) { running = false; timer.stop(); catBtns.forEach(b => (b.disabled = true)); startBtn.parentElement.style.visibility = ''; startBtn.textContent = '🚀 ابدئي التحدي'; card.className = 'sort-card'; card.innerHTML = `<span class="sc-hint">${s.intro}</span>`; } };
  },

      <div class="app rv" dir="ltr">

          <div class="tg"><button class="tbtn" data-a="play" title="شغّل Play">${ICON.play}</button><button class="tbtn" data-a="pause" title="إيقاف مؤقت Pause">${ICON.pause}</button><button class="tbtn" data-a="stop" title="توقف Stop">${ICON.stop}</button><button class="tbtn" data-a="record" title="سجّل Record">${ICON.record}</button></div>

          <div class="tg"><span class="tg-label">Effect</span><button class="mbtn" data-a="fade">Fade In · التلاشي</button><button class="mbtn" data-a="speed">Change Speed · السرعة</button></div>
