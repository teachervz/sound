        </div>
        <div class="tracks">
          <div class="track t1"><div class="tr-head"><span>🎵 Audio 1</span><small class="t1-name">${AudioLab.sourceName()}</small></div><canvas height="200"></canvas></div>
          <div class="track t2 hidden"><div class="tr-head"><span>🥁 Audio 2</span><small>Gain: <b class="gain-val">0 dB</b></small><input type="range" min="-18" max="6" step="1" value="0" title="تضخيم الصوت Gain"></div><canvas height="130"></canvas></div>
        </div>
        <div class="app-status"><span class="st-sel">👆 اسحبي بالفأرة على الموجة لتحديد جزء</span><span class="st-len"></span></div>
        <div class="modal hidden"><div class="modal-card"><h4>⏩ تغيير السرعة Change Speed</h4>
          <div class="speed-val">×1.00</div><input type="range" min="50" max="200" step="5" value="150">
          <div class="modal-btns"><button class="btn btn-sm btn-ghost" data-m="preview">▶ معاينة Preview</button><button class="btn btn-sm" data-m="ok">موافق OK</button><button class="btn btn-sm btn-outline" data-m="cancel">إلغاء</button></div></div></div>
      </div></div>`;

    const sr = () => Sound.ac().sampleRate;
    const S = { t1: null, t2: null, sel: null, pos: 0, gain: 1, undo: [], redo: [], play: null, done: new Set() };
    const cv1 = $('.t1 canvas', el), cv2 = $('.t2 canvas', el), app = $('.app', el);
    const total = () => Math.max(S.t1 ? S.t1.length : 1, S.t2 ? S.t2.length : 0);

    function ensure() { if (!S.t1) { S.t1 = AudioLab.source().getChannelData(0).slice(); S.fromSource = true; } }
    /* عند اكتمال تحميل النشيد: استبدال اللحن المؤقت إن لم تبدأ الطالبة التعديل */
    document.addEventListener('anthem-ready', () => {
      $('.t1-name', el).textContent = AudioLab.sourceName();
      if (S.t1 && S.fromSource && !S.undo.length) { stopPlay(); S.t1 = AudioLab.source().getChannelData(0).slice(); S.sel = null; S.pos = 0; draw(); }
    });
    function draw(ph) {
      if (!S.t1) return; const T = total();
      drawWave(cv1, S.t1, { total: T, sel: S.sel, playhead: ph != null ? ph : (S.pos ? S.pos : null) });
      if (S.t2) drawWave(cv2, S.t2, { total: T, sel: S.sel, playhead: ph != null ? ph : (S.pos ? S.pos : null), color: '#0b8a7d', color2: '#2dd4bf' });
      const f = x => (x / sr()).toFixed(2);
      $('.st-sel', el).textContent = S.sel ? `التحديد: ${f(S.sel.a)} ← ${f(S.sel.b)} ثانية` : '👆 اسحبي بالفأرة على الموجة لتحديد جزء';
      $('.st-len', el).textContent = `المدة: ${(total() / sr()).toFixed(1)} ث`;
    }
    function mark(id) {
      if (S.done.has(id)) return; S.done.add(id);
      const li = $(`[data-task="${id}"]`, el); if (li) { li.classList.add('done'); popEl(li); }
      const core = s.tasks.filter(t => !t.optional), n = core.filter(t => S.done.has(t.id)).length;
      $('.tasks-prog span', el).style.width = (n / core.length * 100) + '%';
      if (n === core.length && !S.celebrated) { S.celebrated = true; setTimeout(() => { Sound.success(); confetti(200); toast('🎧 أحسنتِ يا خبيرة الصوت! أنجزتِ جميع المهام 👏'); }, 400); }
    }
    const snap = () => ({ t1: S.t1.slice(), t2: S.t2 ? S.t2.slice() : null });
    function pushUndo() { S.undo.push(snap()); if (S.undo.length > 15) S.undo.shift(); S.redo = []; }
    function restore(st) { S.t1 = st.t1; S.t2 = st.t2; S.sel = null; S.pos = 0; $('.t2', el).classList.toggle('hidden', !S.t2); fit(); draw(); }
    function fit() { cv1.width = cv1.clientWidth || 900; if (S.t2) cv2.width = cv2.clientWidth || 900; }
    const needSel = () => { if (!S.sel) { toast('حدّدي جزءاً من الموجة أولاً بالسحب بالفأرة 👆'); return false; } return true; };

    /* ----- التشغيل ----- */
    function stopPlay(keepPos) {
      if (!S.play) return; const p = S.play; S.play = null;
      p.srcs.forEach(x => { try { x.stop(); } catch (e) {} }); cancelAnimationFrame(p.raf);
      if (keepPos) S.pos = clamp(Math.round(p.a + (Sound.ac().currentTime - p.t0) * sr()), 0, total());
      $('[data-a=play]', el).classList.remove('on'); draw();
    }
    function play() {
      ensure(); stopPlay(); const c = Sound.ac();
      let a = 0, b = total(); const isSel = !!S.sel;
      if (isSel) { a = S.sel.a; b = S.sel.b; } else if (S.pos > 0 && S.pos < total() - 100) a = S.pos;
      const t0 = c.currentTime + 0.03, srcs = [];
      const mk = (data, gain) => {
        if (!data || a >= data.length) return null;
        const src = c.createBufferSource(); src.buffer = AudioLab.toBuffer(data);
        const g = c.createGain(); g.gain.value = gain; src.connect(g).connect(Sound.out());
        src.start(t0, a / sr(), (Math.min(b, data.length) - a) / sr()); srcs.push(src); return g;
      };
      mk(S.t1, 1); const g2 = mk(S.t2, S.gain);
      S.play = { srcs, t0, a, b, g2, raf: 0 };
      $('[data-a=play]', el).classList.add('on');
      const loop = () => {
        if (!S.play) return;
        const p = a + (c.currentTime - t0) * sr();
        if (p >= b) { stopPlay(); S.pos = 0; draw(); return; }
        draw(Math.max(a, p)); S.play.raf = requestAnimationFrame(loop);
      };
      loop();
      if (isSel) mark('playSel'); else if (a === 0) mark('play');
    }

    /* ----- التحديد بالسحب ----- */
    let drag = null;
    const toSample = (e, cv) => { const r = cv.getBoundingClientRect(); return Math.round(clamp((e.clientX - r.left) / r.width, 0, 1) * total()); };
    [cv1, cv2].forEach(cv => {
      cv.addEventListener('pointerdown', e => { ensure(); stopPlay(); cv.setPointerCapture(e.pointerId); drag = toSample(e, cv); S.sel = null; draw(); });
      cv.addEventListener('pointermove', e => { if (drag == null) return; const x = toSample(e, cv); S.sel = { a: Math.min(drag, x), b: Math.max(drag, x) }; draw(); });
      cv.addEventListener('pointerup', e => {
        if (drag == null) return; const x = toSample(e, cv);
        if (Math.abs(x - drag) < total() * 0.01) { S.sel = null; S.pos = x; } else S.pos = 0;
        drag = null; draw();
      });
    });

    /* ----- تغيير السرعة (إعادة تشكيل العينات) ----- */
    const modal = $('.modal', el), range = $('.modal input', el), sv = $('.speed-val', el);
    const factor = () => +range.value / 100;
    const showF = () => (sv.textContent = '×' + factor().toFixed(2) + (factor() > 1 ? ' 🐿️' : factor() < 1 ? ' 🐢' : ''));
    range.oninput = showF;
    let prevStop = null;
    modal.addEventListener('click', e => {
      const m = e.target.closest('[data-m]'); if (!m) return; const k = m.dataset.m;
      if (prevStop) { prevStop(); prevStop = null; }
      if (k === 'preview') prevStop = AudioLab.play(AudioLab.toBuffer(S.t1.slice(S.sel.a, Math.min(S.sel.b, S.t1.length))), factor());
      if (k === 'cancel') modal.classList.add('hidden');
      if (k === 'ok') {
        const a = S.sel.a, b = Math.min(S.sel.b, S.t1.length), f = factor(); if (b <= a) { modal.classList.add('hidden'); return; }
        pushUndo();
        const seg = S.t1.subarray(a, b), nl = Math.max(1, Math.round(seg.length / f)), out = new Float32Array(nl);
        for (let j = 0; j < nl; j++) { const x = j * f, i = Math.floor(x), fr = x - i; out[j] = (seg[i] || 0) * (1 - fr) + (seg[i + 1] || 0) * fr; }
        const n = new Float32Array(S.t1.length - seg.length + nl); n.set(S.t1.subarray(0, a)); n.set(out, a); n.set(S.t1.subarray(b), a + nl);
        S.t1 = n; S.sel = { a, b: a + nl }; modal.classList.add('hidden'); draw(); mark('speed');
        toast(f > 1 ? 'تم تسريع الجزء المحدد 🐿️ شغّليه لتسمعي الفرق' : 'تم إبطاء الجزء المحدد 🐢 شغّليه لتسمعي الفرق');
      }
    });

    /* ----- أزرار شريط الأدوات ----- */
    $('.app-tools', el).addEventListener('click', async e => {
      const btn = e.target.closest('[data-a]'); if (!btn) return; ensure();
      const a = btn.dataset.a;
      if (a === 'play') play();
      if (a === 'pause') { if (S.play) stopPlay(true); }
      if (a === 'stop') { stopPlay(); S.pos = 0; draw(); }
      if (a === 'all') { S.sel = { a: 0, b: total() }; draw(); }
      if (a === 'undo') { stopPlay(); if (!S.undo.length) return toast('لا يوجد ما يمكن التراجع عنه'); S.redo.push(snap()); restore(S.undo.pop()); toast('↶ تم التراجع'); }
      if (a === 'redo') { stopPlay(); if (!S.redo.length) return toast('لا يوجد ما يمكن تكراره'); S.undo.push(snap()); restore(S.redo.pop()); toast('↷ تم التكرار'); }
      if (a === 'delete') {
        if (!needSel()) return; stopPlay(); const s0 = S.sel.a, s1 = Math.min(S.sel.b, S.t1.length);
        if (s1 - s0 >= S.t1.length - 100) return toast('لا يمكن حذف المقطع كاملاً 😅 حدّدي جزءاً منه فقط');
        pushUndo(); const n = new Float32Array(S.t1.length - (s1 - s0)); n.set(S.t1.subarray(0, s0)); n.set(S.t1.subarray(s1), s0);
        S.t1 = n; S.sel = null; S.pos = 0; draw(); mark('delete'); Sound.pop(); toast('🗑️ تم حذف الجزء المحدد — لاحظي قِصر الموجة');
      }
      if (a === 'fade') {
        if (!needSel()) return; stopPlay(); pushUndo(); const s0 = S.sel.a, s1 = Math.min(S.sel.b, S.t1.length);
        for (let i = s0; i < s1; i++) S.t1[i] *= (i - s0) / (s1 - s0);
        draw(); mark('fade'); Sound.pop(); toast('✨ تم تطبيق التلاشي Fade In — لاحظي شكل الموجة يكبر تدريجياً');
      }
      if (a === 'speed') { if (!needSel()) return; stopPlay(); range.value = 150; showF(); modal.classList.remove('hidden'); }
      if (a === 'import') {
        if (S.t2) return toast('تم دمج المقطع مسبقاً 🥁 شغّلي لتسمعي الصوتين معاً');
        stopPlay(); pushUndo(); S.t2 = AudioLab.beat(S.t1.length); $('.t2', el).classList.remove('hidden'); fit(); draw(); mark('import'); Sound.pop();
        toast('🥁 ظهر شكل موجة جديد أسفل التسجيل السابق — شغّلي واضبطي Gain');
      }
      if (a === 'save') { mark('save'); Sound.success(); toast('💾 تم حفظ المشروع باسم: مشروعي.aup ✅ (ولحفظه MP3 نحتاج إلى التصدير)', 4000); }
      if (a === 'record') {
        stopPlay(); btn.classList.add('rec');
        const ov = document.createElement('div'); ov.className = 'rec-overlay'; app.appendChild(ov);
        try {
          const b = await AudioLab.record(4, n => (ov.textContent = `🔴 تحدّثي الآن… ${n}`));
          pushUndo(); S.t1 = b.getChannelData(0).slice(); S.t2 = null; $('.t2', el).classList.add('hidden');
          S.sel = null; S.pos = 0; $('.t1-name', el).textContent = 'تسجيلي 🎙️'; draw(); mark('record'); toast('🎙️ تم التسجيل! الآن حرّري صوتكِ');
        } catch (err) { toast('تعذّر الوصول إلى الميكروفون 🎤 تأكدي من السماح للمتصفح باستخدامه'); }
        ov.remove(); btn.classList.remove('rec');
      }
    });
    $('.t2 input', el).oninput = e => {
      const db = +e.target.value; S.gain = Math.pow(10, db / 20);
      $('.gain-val', el).textContent = (db > 0 ? '+' : '') + db + ' dB';
      if (S.play && S.play.g2) S.play.g2.gain.value = S.gain;
    };
    el._enter = () => { ensure(); fit(); draw(); };
    el._leave = () => { stopPlay(); if (prevStop) { prevStop(); prevStop = null; } };
  },

  /* ---------- صح أم خطأ ---------- */
  tf(s, el) {
    el.innerHTML = head(s) + `<div class="tf-list">${s.statements.map((st, i) => `
      <div class="tf-row rv" data-i="${i}"><div class="tf-num">${i + 1}</div><div class="tf-text">${st.text}<div class="tf-fix"></div></div>
      <div class="tf-btns"><button class="tf-b t" data-v="1">✔ صح</button><button class="tf-b f" data-v="0">✖ خطأ</button></div></div>`).join('')}</div>`;
    let solved = 0;
    $$('.tf-row', el).forEach(row => {
      const st = s.statements[row.dataset.i], fix = $('.tf-fix', row);
      $$('.tf-b', row).forEach(b => (b.onclick = () => {
        if (row.classList.contains('ok')) return;
        if ((b.dataset.v === '1') === st.answer) {
          row.classList.add('ok'); fix.className = 'tf-fix ok';
          fix.textContent = st.answer ? 'أحسنتِ! 👏 العبارة صحيحة' : 'أحسنتِ! 👏 التصحيح: ' + st.fix;
          Sound.success(); solved++;
          if (solved === s.statements.length) { confetti(); toast('🌟 رائع! أجبتِ عن جميع العبارات'); }
        } else { shake(row); fix.className = 'tf-fix no'; fix.textContent = 'حاولي مرة أخرى 💜'; Sound.wrong(); }
      }));
    });
  },

  /* ---------- صناديق المراجعة ---------- */
  boxes(s, el) {
    const colors = ['#8b5cf6', '#0fa797', '#f59e0b', '#ec4867', '#0ea5e9', '#5530b0'];
    el.innerHTML = head(s) + `<div class="boxes">${s.questions.map((q, i) => `<button class="box rv" data-i="${i}" style="--c:${colors[i % colors.length]}">${i + 1}</button>`).join('')}</div>
      <div class="box-modal hidden"><div class="bm-card"><div class="bm-num"></div><div class="bm-q"></div><div class="bm-a hidden"></div>
      <div class="bm-btns"><button class="btn btn-outline" data-show>👁️ أظهري الإجابة</button><button class="btn" data-close>✔ تم</button></div></div></div>`;
    const modal = $('.box-modal', el); let cur = null;
    $$('.box', el).forEach(b => (b.onclick = () => {
      cur = b; const q = s.questions[b.dataset.i];
      $('.bm-num', el).textContent = 'السؤال ' + (+b.dataset.i + 1); $('.bm-q', el).textContent = q.q;
      const a = $('.bm-a', el); a.textContent = q.a; a.classList.add('hidden');
      modal.classList.remove('hidden'); Sound.pop();
    }));
    $('[data-show]', el).onclick = () => { $('.bm-a', el).classList.remove('hidden'); Sound.success(); };
    $('[data-close]', el).onclick = () => { modal.classList.add('hidden'); cur && cur.classList.add('used'); };
    el._leave = () => modal.classList.add('hidden');
  },

  /* ---------- الخلاصة ---------- */
  summary(s, el) {
    el.innerHTML = head(s) + `<div class="sum-grid">${s.nodes.map(n => `<div class="sum rv" style="--c:${n.color}"><div class="s-ic">${n.icon}</div><h4>${n.title}</h4><p>${n.text}</p></div>`).join('')}</div>`;
  },

  /* ---------- التقييم الفوري ---------- */
  exit(s, el) {
    el.innerHTML = head(s) + `<div class="exit">
      <div class="vote">${s.options.map((o, i) => `<button class="vote-b rv" data-i="${i}" style="--c:${o.color}"><span class="v-ic">${o.icon}</span><span class="v-l">${o.label}</span><span class="v-bar"><i></i></span><b class="v-n">0</b></button>`).join('')}
        <div class="rv"><button class="btn btn-ghost btn-sm" data-resetv>🔄 تصفير التصويت</button></div></div>
      <div class="ticket rv"><h3>🎫 بطاقة الخروج</h3><ol>${s.ticket.map(t => `<li>${t}</li>`).join('')}</ol></div></div>`;
    const counts = s.options.map(() => 0);
    const upd = () => { const mx = Math.max(1, ...counts); $$('.vote-b', el).forEach((b, i) => { $('.v-n', b).textContent = counts[i]; $('.v-bar i', b).style.width = (counts[i] / mx * 100) + '%'; }); };
    $$('.vote-b', el).forEach(b => (b.onclick = () => { counts[b.dataset.i]++; upd(); popEl(b); Sound.pop(); }));
    $('[data-resetv]', el).onclick = () => { counts.fill(0); upd(); };
  },

  /* ---------- الختام ---------- */
  closing(s, el) {
    el.innerHTML = `<div class="closing">
      <div class="float-icons">${s.icons.map((ic, i) => `<span style="--k:${i}">${ic}</span>`).join('')}</div>
      <div class="cl-star rv">🌟</div><h1 class="cl-title rv">${s.title}</h1><p class="cl-msg rv">${s.message}</p>
      <div class="cl-row"><div class="cl-card rv"><span>🏆 الفريق المتميز اليوم</span><b class="winner">—</b></div>
        <div class="cl-card rv"><span>${s.homework.title}</span><b>${s.homework.text}</b></div></div>
      <button class="btn btn-lg rv" data-clap>👏 صفّقن لأنفسكنّ!</button></div>`;
    el._enter = () => {
      const mx = Math.max(...Scores);
      $('.winner', el).textContent = mx === 0 ? 'كلّكنّ متميزات 💜' : LESSON.teams.filter((_, i) => Scores[i] === mx).map(t => `${t.icon} فريق ${t.name}`).join(' و ') + ` (${mx} نقطة)`;
      setTimeout(() => confetti(180), 700);
    };
    $('[data-clap]', el).onclick = clap;
  }
};

/* #####################################################################
   🏆 نقاط الفرق
   ##################################################################### */
let Scores = LESSON.teams.map(() => 0);
try { const saved = JSON.parse(localStorage.getItem('mm-scores') || 'null'); if (Array.isArray(saved) && saved.length === Scores.length) Scores = saved; } catch (e) {}
function buildScoreboard() {
  $('#scoreboard').innerHTML = `<h4>🏆 نقاط الفرق</h4>` + LESSON.teams.map((t, i) => `
    <div class="sb-row" style="--c:${t.color}"><span class="sb-ic">${t.icon}</span><span class="sb-n">${t.name}</span>
    <button data-team="${i}" data-d="-1">−</button><b data-score="${i}">0</b><button class="plus" data-team="${i}" data-d="1">+</button></div>`).join('') +
    `<button class="cbtn" data-resetscores style="margin-top:6px">🔄 تصفير النقاط</button>`;
}
function updateScores() {
  $$('[data-score]').forEach(e => (e.textContent = Scores[e.dataset.score]));
  try { localStorage.setItem('mm-scores', JSON.stringify(Scores)); } catch (e) {}
}

/* #####################################################################
   🎬 محرك العرض: البناء + التنقل + لوحة المفاتيح + الشريط السفلي
   ##################################################################### */
const stage = $('#stage');
const slides = [];
let current = -1;

function build() {
  LESSON.slides.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide type-' + s.type;
    (Renderers[s.type] || ((x, e) => (e.innerHTML = head(x))))(s, el);
    $$('.rv', el).forEach((r, k) => r.style.setProperty('--i', Math.min(k, 14)));
    stage.appendChild(el); slides.push(el);
  });
  $('#tot').textContent = slides.length;
}

function go(n, instant) {
  n = clamp(n, 0, slides.length - 1);
  if (n === current) return;
  const dir = n > current ? 'next' : 'prev';
  const old = slides[current], neu = slides[n];
  if (old) {
    old._leave && old._leave(); (old._timers || []).forEach(t => t.stop());
    old.classList.remove('active'); old.classList.add('leave');
    setTimeout(() => old.classList.remove('leave'), 700);
  }
  const anim = LESSON.slides[n].anim || 'slide';
  const pre = 'pre-' + (anim === 'slide' ? 'slide-' + dir : anim);
  neu.classList.remove('leave');
  if (instant) neu.classList.add('no-anim');
  neu.classList.add(pre); void neu.offsetWidth;
  neu.classList.remove(pre); neu.classList.add('active');
  if (instant) requestAnimationFrame(() => neu.classList.remove('no-anim'));
  current = n;
  neu._enter && neu._enter();
  $('#cur').textContent = n + 1;
  $('#progress span').style.width = ((n + 1) / slides.length * 100) + '%';
  $('#prevBtn').disabled = n === 0; $('#nextBtn').disabled = n === slides.length - 1;
  try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) {}
}
const next = () => go(current + 1);
const prev = () => go(current - 1);

/* ----- ملاءمة المسرح لحجم الشاشة بنسبة 16:9 ----- */
function fitStage() {
  const sc = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${sc})`;
}
addEventListener('resize', fitStage);

/* ----- لوحة المفاتيح ----- */
document.addEventListener('keydown', e => {
  const typing = e.target.matches && e.target.matches('input[type=text], textarea, [contenteditable]');
  if (typing) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.key) {
    case 'ArrowRight': case ' ': case 'Spacebar': case 'PageDown': case 'Enter':
      if (e.key === 'Enter' && e.target.tagName === 'BUTTON') return;
      e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': case 'Backspace':
      e.preventDefault(); prev(); break;
    case 'ArrowUp': case 'ArrowDown':
      e.preventDefault(); break;
    case 'Home': e.preventDefault(); go(0); break;
    case 'End': e.preventDefault(); go(slides.length - 1); break;
    case 'ت': case 'f': case 'F':   /* حرف ت (يقع على مفتاح F) */
      e.preventDefault(); clap(); break;
  }
  wake();
});
/* منع التمرير بالعجلة أو اللمس */
addEventListener('wheel', e => e.preventDefault(), { passive: false });
addEventListener('touchmove', e => { if (!e.target.closest('input[type=range], canvas')) e.preventDefault(); }, { passive: false });

/* ----- الأزرار العامة (تفويض الأحداث) ----- */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setTimeout(() => b.blur(), 0); /* حتى لا يضغط Space على الزر مرة أخرى */
  const t = e.target.closest('[data-team]');
  if (t) { const i = +t.dataset.team; Scores[i] = Math.max(0, Scores[i] + +t.dataset.d); updateScores(); if (+t.dataset.d > 0) { Sound.pop(); $$(`[data-score="${i}"]`).forEach(popEl); } }
  if (e.target.closest('[data-resetscores]')) { Scores = Scores.map(() => 0); updateScores(); }
  if (e.target.closest('[data-act="next"]')) next();
});
$('#nextBtn').onclick = next;
$('#prevBtn').onclick = prev;
$('#clapBtn').onclick = clap;
$('#scoreBtn').onclick = () => $('#scoreboard').classList.toggle('open');
$('#fsBtn').onclick = () => {
  const d = document;
  if (!d.fullscreenElement) (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (() => {})).call(d.documentElement);
  else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
};

/* ----- إخفاء شريط التحكم تلقائياً عند عدم تحريك الماوس ----- */
let idleT;
function wake() {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => { if (!$('#controls:hover') && !$('#scoreboard.open')) document.body.classList.add('idle'); }, 3000);
}
['mousemove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));

/* ----- التشغيل ----- */
if (location.search.includes('static')) document.head.insertAdjacentHTML('beforeend', '<style>.slide .rv{opacity:1!important;translate:none!important;animation:none!important}</style>');
build();
buildScoreboard();
updateScores();
fitStage();
const startAt = parseInt((location.hash || '').slice(1), 10);
go(Number.isFinite(startAt) ? startAt - 1 : 0, true);
wake();
</script>
</body>
</html>
